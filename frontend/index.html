<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1Pannel</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/1panel-favicon.svg" />
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #f3edf7;
      }
      html.dark,
      html.dark body,
      html.dark #app {
        background: #141218;
      }
      /* 磨砂：骨架阶段即透明，配合原生磨砂底（与 index.scss 同规则） */
      html.frosted,
      html.frosted body,
      html.frosted #app {
        background: transparent;
      }
      .boot-skel {
        display: grid;
        height: 100%;
        grid-template-rows: 40px 1fr;
        grid-template-columns: var(--boot-sidebar, 320px) 1fr;
        background: #f7f2fa;
      }
      html.dark .boot-skel {
        background: #1d1b20;
      }
      html.boot-no-side .boot-skel {
        grid-template-columns: 1fr;
      }
      html.boot-no-side .boot-side,
      html.boot-no-side .boot-tb-l {
        display: none;
      }
      .boot-tb-l,
      .boot-tb-r {
        background: transparent;
      }
      .boot-tb-r {
        display: flex;
        align-items: center;
        padding: 0 20px;
      }
      .boot-title {
        width: 96px;
        height: 12px;
        border-radius: 4px;
        background: rgba(29, 27, 32, 0.08);
      }
      html.dark .boot-title {
        background: rgba(230, 224, 233, 0.1);
      }
      .boot-side {
        padding: 12px 10px;
      }
      .boot-line {
        height: 28px;
        margin-bottom: 8px;
        border-radius: 28px;
        background: rgba(29, 27, 32, 0.06);
      }
      html.dark .boot-line {
        background: rgba(230, 224, 233, 0.06);
      }
      .boot-main {
        background: #f3edf7;
        padding: 16px 20px;
        overflow: hidden;
      }
      html.dark .boot-main {
        background: #211f26;
      }
      .boot-card {
        height: 88px;
        margin-bottom: 8px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 0 0 1px #cac4d0;
      }
      html.dark .boot-card {
        background: #2b2930;
        box-shadow: none;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .boot-tile {
        height: 72px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 0 0 1px #cac4d0;
      }
      html.dark .boot-tile {
        background: #2b2930;
        box-shadow: none;
      }
      .boot-pulse {
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var t = "auto";
          var raw = localStorage.getItem("ipannel.settings.v1");
          if (raw) {
            var p = JSON.parse(raw);
            if (p && p.theme) t = p.theme;
          } else {
            var old = localStorage.getItem("ipannel.theme");
            if (old) t = old;
          }
          if (t === "auto") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.className = t === "dark" ? "dark" : "light";
          document.documentElement.style.colorScheme = t === "dark" ? "dark" : "light";
        } catch (e) {
          var darkBoot = matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.className = darkBoot ? "dark" : "light";
          document.documentElement.style.colorScheme = darkBoot ? "dark" : "light";
        }
        try {
          // 磨砂默认值按平台：macOS 开，其余关（与 settings store 的
          // DEFAULTS.frostedChrome 对齐），骨架屏阶段即生效，避免 Vue 挂载后二次切换闪烁
          var frosted = /Mac|iPhone|iPad/.test(navigator.platform);
          var s = localStorage.getItem("ipannel.settings.v1");
          if (s) {
            var sp = JSON.parse(s);
            if (sp && typeof sp.frostedChrome === "boolean") {
              frosted = sp.frostedChrome;
            }
          }
          if (frosted) {
            document.documentElement.classList.add("frosted");
          }
        } catch (e) {}
        try {
          var n = Number(localStorage.getItem("ipannel.sidebarWidth"));
          if (n >= 180 && n <= 320) {
            document.documentElement.style.setProperty("--boot-sidebar", n + "px");
          }
          if (localStorage.getItem("ipannel.sidebarOpen") === "0") {
            document.documentElement.classList.add("boot-no-side");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-skel">
        <div class="boot-tb-l"></div>
        <div class="boot-tb-r"><div class="boot-title boot-pulse"></div></div>
        <div class="boot-side">
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
        </div>
        <div class="boot-main">
          <div class="boot-card boot-pulse"></div>
          <div class="boot-card boot-pulse"></div>
          <div class="boot-grid">
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
