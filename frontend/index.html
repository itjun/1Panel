<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1Panel</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/1panel-favicon.svg" />
    <style>
      /* boot 骨架：与壳契约对齐 — canvas 底 + surface 内容平面，无透明/磨砂、无分隔线 */
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background-color: var(--color-canvas, #f2f3f5);
        color-scheme: light;
      }
      .boot-skel {
        display: grid;
        height: 100%;
        grid-template-rows: 40px 1fr;
        grid-template-columns: var(--boot-sidebar, 320px) 1fr;
        background: var(--color-canvas, #f2f3f5);
      }
      html.boot-no-side .boot-skel {
        grid-template-columns: 1fr;
      }
      html.boot-no-side .boot-side,
      html.boot-no-side .boot-tb-l {
        display: none;
      }
      .boot-tb-l,
      .boot-tb-r {
        background: var(--color-canvas, #f2f3f5);
      }
      .boot-tb-r {
        display: flex;
        align-items: center;
        padding: 0 20px;
      }
      .boot-title {
        width: 96px;
        height: 12px;
        border-radius: 4px;
        background: rgba(31, 35, 41, 0.08);
      }
      .boot-side {
        padding: 12px 10px;
        background: var(--color-canvas, #f2f3f5);
      }
      .boot-line {
        height: 28px;
        margin-bottom: 8px;
        border-radius: 4px;
        background: rgba(31, 35, 41, 0.06);
      }
      .boot-main {
        background: var(--color-surface, #ffffff);
        overflow: hidden;
      }
      .boot-card {
        height: 88px;
        margin-bottom: 8px;
        border-radius: 0;
        background: var(--color-surface, #ffffff);
        box-shadow: 0 0 0 1px #e5e7eb;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .boot-tile {
        height: 72px;
        border-radius: 0;
        background: var(--color-surface, #ffffff);
        box-shadow: 0 0 0 1px #e5e7eb;
      }
      .boot-pulse {
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      /* 深色骨架：globals.css 尚未加载时 var() 无值，这里给等值回退，
         取值与 html.dark 的 --color-canvas / --color-surface 保持一致 */
      html.dark,
      html.dark body,
      html.dark #app {
        background-color: #12161f;
        color-scheme: dark;
      }
      html.dark .boot-skel,
      html.dark .boot-tb-l,
      html.dark .boot-tb-r,
      html.dark .boot-side {
        background: #12161f;
      }
      html.dark .boot-title {
        background: rgba(255, 255, 255, 0.1);
      }
      html.dark .boot-line {
        background: rgba(255, 255, 255, 0.07);
      }
      html.dark .boot-main,
      html.dark .boot-card,
      html.dark .boot-tile {
        background: #1a1f2b;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    </style>
    <script>
      (function () {
        // 颜色模式默认「跟随系统」；读取已存偏好后在首屏就铺对深浅色，避免先白后黑闪烁
        var pref = "";
        try {
          var raw = localStorage.getItem("ipannel.settings.v1");
          if (raw) pref = (JSON.parse(raw) || {}).appearance || "";
        } catch (e) {}
        if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.className = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        try {
          var n = Number(localStorage.getItem("ipannel.sidebarWidth"));
          if (n >= 180 && n <= 320) {
            document.documentElement.style.setProperty("--boot-sidebar", n + "px");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-skel">
        <div class="boot-tb-l"></div>
        <div class="boot-tb-r"><div class="boot-title boot-pulse"></div></div>
        <div class="boot-side">
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
        </div>
        <div class="boot-main">
          <div class="boot-card boot-pulse"></div>
          <div class="boot-card boot-pulse"></div>
          <div class="boot-grid">
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
</html>
