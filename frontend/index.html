<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1Pannel</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/1panel-favicon.svg" />
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #e8f0fc;
        color-scheme: light;
      }
      .boot-skel {
        display: grid;
        height: 100%;
        grid-template-rows: 40px 1fr;
        grid-template-columns: var(--boot-sidebar, 320px) 1fr;
        background: #e8f0fc;
      }
      html.boot-no-side .boot-skel {
        grid-template-columns: 1fr;
      }
      html.boot-no-side .boot-side,
      html.boot-no-side .boot-tb-l {
        display: none;
      }
      .boot-tb-l,
      .boot-tb-r {
        background: transparent;
      }
      .boot-tb-r {
        display: flex;
        align-items: center;
        padding: 0 20px;
      }
      .boot-title {
        width: 96px;
        height: 12px;
        border-radius: 4px;
        background: rgba(31, 35, 41, 0.08);
      }
      .boot-side {
        padding: 12px 10px;
      }
      .boot-line {
        height: 28px;
        margin-bottom: 8px;
        border-radius: 28px;
        background: rgba(31, 35, 41, 0.06);
      }
      .boot-main {
        background: #f4f4f4;
        padding: 16px 20px;
        overflow: hidden;
      }
      .boot-card {
        height: 88px;
        margin-bottom: 8px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 0 0 1px #e4e7ed;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .boot-tile {
        height: 72px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 0 0 1px #e4e7ed;
      }
      .boot-pulse {
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
    <script>
      (function () {
        document.documentElement.className = "light";
        document.documentElement.style.colorScheme = "light";
        try {
          var n = Number(localStorage.getItem("ipannel.sidebarWidth"));
          if (n >= 180 && n <= 320) {
            document.documentElement.style.setProperty("--boot-sidebar", n + "px");
          }
          if (localStorage.getItem("ipannel.sidebarOpen") === "0") {
            document.documentElement.classList.add("boot-no-side");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-skel">
        <div class="boot-tb-l"></div>
        <div class="boot-tb-r"><div class="boot-title boot-pulse"></div></div>
        <div class="boot-side">
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
          <div class="boot-line boot-pulse"></div>
        </div>
        <div class="boot-main">
          <div class="boot-card boot-pulse"></div>
          <div class="boot-card boot-pulse"></div>
          <div class="boot-grid">
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
            <div class="boot-tile boot-pulse"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
</html>
