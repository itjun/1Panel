version: '3'

vars:
  APP_NAME: "1Panel"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: bun
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation.
  GOOS: '{{.GOOS | default OS}}'
  # spanel-agent 版本：单一来源 internal/agentres/VERSION（源码变动时 agent:build 自动升补丁号）
  VERSION:
    sh: 'tr -d " \t\n" < internal/agentres/VERSION'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  wails:check:
    summary: Ensure Wails CLI / go.mod / @wailsio/runtime versions match
    cmds:
      - ./scripts/check-wails-version.sh

  build:
    summary: Builds the application
    deps: [wails:check]
    cmds:
      # 先交叉编译 agent 产物：面板 go:embed 内嵌它，版本号与面板一致
      - task: agent:build
      - task: "{{.GOOS}}:build"

  agent:build:
    summary: 源码若有改动则升版本并交叉编译；未改且产物在则跳过（不升版本）
    cmds:
      - |
        set -e
        AMD=internal/agentres/bin/spanel-agent-linux-amd64
        ARM=internal/agentres/bin/spanel-agent-linux-arm64
        V=$(tr -d ' \t\n' < internal/agentres/VERSION)
        if [ -f "$AMD" ] && [ -f "$ARM" ] \
          && go run ./cmd/agentversion check >/dev/null 2>&1 \
          && strings "$AMD" | grep -Fqx "$V"; then
          echo "spanel-agent $V 源码未变且产物版本一致，沿用已有产物"
          exit 0
        fi
        go run ./cmd/agentversion sync
        V=$(tr -d ' \t\n' < internal/agentres/VERSION)
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=$V" -o "$AMD" ./cmd/spanel-agent
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=$V" -o "$ARM" ./cmd/spanel-agent
        echo "spanel-agent $V 构建完成（amd64 + arm64）"

  agent:test:
    summary: 构建 agent 并部署到 cdcp-beta 联调（原子替换运行中二进制后重启）
    cmds:
      - task: agent:build
      - scp -q internal/agentres/bin/spanel-agent-linux-amd64 cdcp-beta:/tmp/spanel-agent.new
      - ssh cdcp-beta "mv /tmp/spanel-agent.new /usr/local/bin/spanel-agent && chmod 755 /usr/local/bin/spanel-agent && systemctl restart spanel-agent && sleep 1 && systemctl is-active spanel-agent"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    deps: [wails:check]
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
