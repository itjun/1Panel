name: Release

# 打 v* tag 时触发:构建 Mac + Windows 两个平台包,上传到 GitHub Release
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: 1Panel-${{ github.ref_name }}-mac-universal.zip
          - os: windows-latest
            artifact: 1Panel-${{ github.ref_name }}-win-amd64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Vite 8 要求 Node >= 20.19 / 22.12+
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Wails v3 CLI 版本从 go.mod 读取，禁止硬编码漂移
      - name: Install wails3
        shell: bash
        run: |
          WAILS_VER="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VER}"

      # v3 构建体系基于 Taskfile
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Add GOBIN to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Check Wails versions
        shell: bash
        run: ./scripts/check-wails-version.sh

      # 前端依赖:构建目录是 frontend/(Vue3)
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build + package macOS universal app
        if: runner.os == 'macOS'
        shell: bash
        run: task darwin:package:universal

      - name: Build Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: task windows:build

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: cd bin && zip -r -y "$ARTIFACT" 1Panel.app
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: cd bin && 7z a "$ARTIFACT" 1Panel.exe
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
