name: Release

# 打 v* tag 时触发：构建 Mac + Windows + Linux 三个平台包，连同签名更新清单一起用 gh 发布到 GitHub Release。
# 客户端更新源即 GitHub Release：<repo>/releases/latest/download/latest.json，不依赖外部存储。
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 内嵌产物（spanel-agent amd64/arm64 + 网络测速 iperf3）均被 gitignore，
  # 在 Linux 上统一构建一次，分发给各平台，保证三个包内嵌的版本完全一致。
  embedded:
    name: Build embedded agent + iperf3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 各平台 ldflags 读取已提交的 VERSION；源码改了却没提交新版本号时直接失败，避免版本漂移
      - name: Check agent version committed
        run: go run ./cmd/agentversion check

      - name: Build agent + fetch iperf3
        run: task agent:build

      - uses: actions/upload-artifact@v7
        with:
          name: embedded-bin
          path: |
            internal/agentres/bin/spanel-agent-*
            internal/iperfres/bin/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.artifact }}
    needs: embedded
    runs-on: ${{ matrix.os }}
    env:
      # 注入客户端：应用内更新清单基地址，始终指向最新正式版 Release 的资产
      UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: 1Panel-${{ github.ref_name }}-mac-arm64.dmg
          - os: windows-latest
            artifact: 1Panel-${{ github.ref_name }}-win-amd64.zip
          # 24.04 起官方源提供 webkitgtk-6.0（Wails v3 默认的 GTK4 后端）
          - os: ubuntu-24.04
            artifact: 1Panel-${{ github.ref_name }}-linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@v7

      # 产物路径的公共前缀是 internal/，解压回 internal/ 即还原到 go:embed 目录
      - uses: actions/download-artifact@v8
        with:
          name: embedded-bin
          path: internal

      - name: Verify embedded binaries
        shell: bash
        run: |
          set -e
          test -s internal/agentres/bin/spanel-agent-linux-amd64
          test -s internal/agentres/bin/spanel-agent-linux-arm64
          ls -la internal/agentres/bin internal/iperfres/bin

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Vite 8 要求 Node >= 20.19 / 22.12+
      # packageManager 为 bun，依赖由 bun 安装，关掉 setup-node 按 packageManager 自动开启的缓存
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      # 前端包管理器为 bun，版本取 package.json 的 packageManager
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      # wails3 CLI 自身也链接 GTK4 / WebKitGTK，须在安装 CLI 之前装好
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      # Wails v3 CLI 版本从 go.mod 读取，禁止硬编码漂移
      - name: Install wails3
        shell: bash
        run: |
          WAILS_VER="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          # 从已校验的锁定源码安装，避免额外查询上游 latest 的撤回/弃用元数据。
          go mod download "github.com/wailsapp/wails/v3@${WAILS_VER}"
          WAILS_DIR="$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)"
          go install -C "$WAILS_DIR" ./cmd/wails3

      # v3 构建体系基于 Taskfile
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Add GOBIN to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Check Wails versions
        shell: bash
        run: ./scripts/check-wails-version.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Apple 芯片单架构。macos-latest 本身是 arm64，显式传入避免编出 Intel 切片。
      - name: Build + package macOS arm64 app
        if: runner.os == 'macOS'
        shell: bash
        run: task darwin:package ARCH=arm64

      - name: Verify macOS bundle version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${RELEASE_TAG#v}"
          EXPECTED="${EXPECTED%%[-+]*}"
          PLIST="bin/1Panel.app/Contents/Info.plist"
          for KEY in CFBundleShortVersionString CFBundleVersion; do
            ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST")
            test "$ACTUAL" = "$EXPECTED" || { echo "$KEY=$ACTUAL，预期 $EXPECTED" >&2; exit 1; }
          done
          codesign --verify --deep --strict bin/1Panel.app
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Build Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: task windows:build

      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: task linux:build

      # 免费分发保留 ad-hoc 签名；DMG 附带离线安装指南，并在挂载后复核应用完整性。
      # 自动更新挂载后仍只取 .app，指南不写入已签名的应用内部。
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          task darwin:create:dmg DMG_OUTPUT="bin/$ARTIFACT"
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: cd bin && 7z a "$ARTIFACT" 1Panel.exe
        env:
          ARTIFACT: ${{ matrix.artifact }}

      # 目录内含二进制 + desktop 项 + 图标；应用内更新只替换其中的 1Panel 二进制
      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DIR="${ARTIFACT%.tar.gz}"
          mkdir -p "bin/$DIR"
          cp bin/1Panel "bin/$DIR/1Panel"
          cp build/linux/com.itjun.panel.desktop "bin/$DIR/"
          cp build/appicon.png "bin/$DIR/1Panel.png"
          tar -C bin -czf "bin/$ARTIFACT" "$DIR"
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 清单签名私钥（ed25519 种子 base64），原件在发布者本机，不进仓库
      UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 1Panel-*
          merge-multiple: true

      - name: Include offline macOS installation guide
        run: cp docs/macos-install.html dist/1Panel-macOS-install.html

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 客户端已内置指向 GitHub Release 的更新源，缺清单会让所有客户端检查失败，因此私钥为必需项
      - name: Build signed update manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGN_KEY" ]; then
            echo "::error::未配置 Secret UPDATE_SIGN_KEY，无法签名更新清单"
            exit 1
          fi
          git fetch --force --tags
          # 更新说明：取附注 tag 的说明；轻量 tag 为空时客户端只显示版本号
          git for-each-ref "refs/tags/$VERSION" --format='%(contents)' > notes.md
          # darwin-universal 与 darwin-arm64 是同一份 arm64 磁盘映像。
          # v1.1.0 客户端只认 darwin-universal，保留别名才能继续找到安装包。
          go run ./cmd/releasetool manifest \
            -version "$VERSION" \
            -base-url "https://github.com/$GH_REPO/releases/download" \
            -policy release/update-policy.json \
            -notes-file notes.md \
            -asset "darwin-arm64=dist/1Panel-$VERSION-mac-arm64.dmg" \
            -asset "darwin-universal=dist/1Panel-$VERSION-mac-arm64.dmg" \
            -asset "windows-amd64=dist/1Panel-$VERSION-win-amd64.zip" \
            -asset "linux-amd64=dist/1Panel-$VERSION-linux-amd64.tar.gz" \
            -out dist/latest.json
          go run ./cmd/releasetool sign -in dist/latest.json -out dist/latest.json.sig
          # 用客户端内置公钥再校验一遍，防止 Secret 里的私钥与代码里的公钥不配对
          go run ./cmd/releasetool verify -in dist/latest.json -sig dist/latest.json.sig
          cat dist/latest.json
          ls -la dist

      # 先以草稿上传全部资产再一次性公开：releases/latest 不含草稿，客户端读到新清单时安装包一定已就绪。
      # 带预发布后缀（如 v1.2.0-rc.1）的版本标为 prerelease，不会成为 latest，客户端不会收到。
      - name: Publish with gh
        shell: bash
        run: |
          set -euo pipefail
          cat >> notes.md <<EOF

          ### macOS 安装

          下载 DMG 后，将 1Panel 拖入“应用程序”；首次打开被拦截时，在“系统设置 → 隐私与安全性”中确认“仍要打开”。
          [在线安装指南](https://itjun.github.io/1Panel/install.html)包含 macOS、Windows 和 Linux 的安装步骤；[macOS 终端方式](https://itjun.github.io/1Panel/macos-install.html#commands)提供清理隔离属性与重置签名命令。
          DMG 内附有“安装指南.html”，也可单独下载[离线安装指南](https://github.com/$GH_REPO/releases/download/$VERSION/1Panel-macOS-install.html)。
          EOF
          if [[ "$VERSION" == *-* ]]; then
            publish=(--prerelease --latest=false)
          else
            publish=(--latest)
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --draft --verify-tag \
              --title "$VERSION" \
              --notes-file notes.md --generate-notes
          fi
          # 列表里只显示版本号，不再在前面加应用名。
          gh release edit "$VERSION" --title "$VERSION" --draft=false "${publish[@]}"
          gh release view "$VERSION"
