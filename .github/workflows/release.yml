name: Release

# 打 v* tag 时触发:构建 Mac + Windows 两个平台包,上传到 GitHub Release
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: 1Pannel-${{ github.ref_name }}-mac-universal.zip
          - os: windows-latest
            platform: windows/amd64
            artifact: 1Pannel-${{ github.ref_name }}-win-amd64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails CLI 版本与 go.mod 对齐
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      # 前端依赖:构建目录是 frontend/(Vue3),非 frontend-react/
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Windows 构建需要 gcc(CGO,webview2);windows-latest 自带 msys2 mingw,加进 PATH 兜底
      - name: Add mingw to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      - name: Build with wails
        run: wails build -platform ${{ matrix.platform }} -clean

      # 打包产物(windows 用 bash 7z,避免 PowerShell 语法差异)
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: cd build/bin && zip -r -y "$ARTIFACT" 1Pannel.app
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: cd build/bin && 7z a "$ARTIFACT" 1Pannel.exe
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
