# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "1Panel"
arch: ${GOARCH}
platform: "linux"
# 版本由构建方注入（CI 用 tag 去 v、- 转 ~；本地默认见 linux Taskfile 的 generate:deb）
version: ${PANEL_VERSION}
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "运维管理"
vendor: "黄荣君"
homepage: "https://itjun.github.io/1Panel"
license: "MIT"
release: "1"

contents:
  - src: "./bin/1Panel"
    dst: "/usr/local/bin/1Panel"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/1Panel.png"
  - src: "./build/linux/com.itjun.panel.desktop"
    dst: "/usr/share/applications/com.itjun.panel.desktop"
  # pkexec 提权安装更新时的授权文案（缺失时退回通用动作，不影响功能）
  - src: "./build/linux/polkit/com.itjun.panel.pkexec.policy"
    dst: "/usr/share/polkit-1/actions/com.itjun.panel.policy"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # deb：应用内自动更新经 pkexec 提权 dpkg -i，软依赖 polkit（缺失则降级为手动更新提示）
  deb:
    recommends:
      - "policykit-1 | pkexec"

  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
